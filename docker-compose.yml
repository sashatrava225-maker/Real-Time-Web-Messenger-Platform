services:
  db:
    image: postgres:17
    container_name: messenger_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: messenger_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: messenger_backend

    working_dir: /app

    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: messenger
      DB_USER: messenger
      DB_PASSWORD: messenger
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./backend:/app

    ports:
      - "8001:8001"

    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: messenger_worker

    working_dir: /app

    command: celery -A config worker -l info

    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: messenger
      DB_USER: messenger
      DB_PASSWORD: messenger
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./backend:/app

    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: messenger_frontend

    working_dir: /app

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3001"

    ports:
      - "3001:3001"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - web

volumes:
  postgres_data:
  frontend_node_modules:
